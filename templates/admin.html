<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Three V</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #1f1f1f;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 0 15px rgba(255,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: red;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            outline: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover {
            background: darkred;
        }

        .note {
            font-size: 12px;
            color: gray;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>ADMIN LOGIN</h2>

    <form action="/admin" method="POST">
        <input type="text" name="username" placeholder="Admin username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Đăng nhập</button>
    </form>

    <div class="note">
        Chỉ dành cho quản trị viên hệ thống
    </div>
</div>

</body>
</html>
