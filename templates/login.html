<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Three V</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            background:white;
            width:400px;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo h1{
            color:#007bff;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .btn-login{
            width:100%;
            padding:10px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        .btn-login:hover{
            background:#0056b3;
        }

        .register-link{
            text-align:center;
            margin-top:15px;
        }

        .register-link a{
            text-decoration:none;
            color:#007bff;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="logo">
            <h1>Three V</h1>
            <p>Website bán hàng trực tuyến</p>
        </div>

        <form action="/login" method="POST">

            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">
                Đăng nhập
            </button>

        </form>

        <div class="register-link">
            Chưa có tài khoản?
            <a href="/register">Đăng ký ngay</a>
        </div>

    </div>

</body>
</html>
